# =========================================================
# ১টা মাত্র Render web service — n8n + video-edit + tts একই
# কন্টেইনারে। Monthly Included Usage-এ ১টা instance-hour-ই কাটবে।
# =========================================================

services:
  - type: web
    name: n8n-allinone
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    autoDeploy: true
    # FIX: was "/" — with N8N_BASIC_AUTH_ACTIVE=true below, "/" requires
    # login and returns 401, which Render's health checker would treat as
    # unhealthy. /healthz is n8n's dedicated, unauthenticated health
    # endpoint (the Dockerfile's own HEALTHCHECK already targets it).
    healthCheckPath: /healthz

    envVars:
      # ---- Host ----
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_PORT
        value: "5678"
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: GENERIC_TIMEZONE
        value: "Asia/Dhaka"
      - key: TZ
        value: "Asia/Dhaka"

      # ---- Memory / concurrency (mirrors the Dockerfile ENV defaults —
      #      declared here too so they're visible and overridable from
      #      the Render dashboard without rebuilding the image. If you
      #      change one, keep the other in sync.
      #      NOTE: EXECUTIONS_PROCESS is deliberately NOT set — n8n
      #      removed that variable in 1.0; it's a no-op on this version.
      #      This box already runs in regular (non-queue) mode by default
      #      since no QUEUE_BULL_REDIS_* vars are configured anywhere. ----
      - key: NODE_OPTIONS
        value: "--max-old-space-size=200"
      - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
        value: "1"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: "none"
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: "all"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "24"
      - key: EXECUTIONS_TIMEOUT_MAX
        value: "1200"

      # ---- Security ----
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false

      # ---- Database (external Postgres — Neon/Supabase free tier) ----
      - key: DB_TYPE
        value: "postgresdb"
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # ---- Internal microservices (এই একই কন্টেইনারে চলে, বাইরে
      #      এক্সপোজড না — সাধারণত এই ৪টার ডিফল্ট ভ্যালু বদলানোর
      #      দরকার নেই) ----
      - key: RENDER_VIDEO_EDIT_URL
        value: "http://127.0.0.1:3001"
      - key: RENDER_VIDEO_EDIT_API_KEY
        sync: false
      - key: ENABLE_TTS_SERVICE
        value: "false"
      - key: RENDER_TTS_URL
        value: "http://127.0.0.1:3002"
      - key: RENDER_TTS_API_KEY
        sync: false

      # ---- Workflow: AI script-generation keys ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_REFERER_URL
        sync: false
      - key: RENDER_AI_AGENT_URL
        sync: false
      - key: RENDER_AI_AGENT_API_KEY
        sync: false

      # ---- Workflow: voice / TTS (ElevenLabs -> edge-tts CLI -> silent) ----
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: EDGE_TTS_VOICE
        value: "en-US-AndrewNeural"

      # ---- Workflow: YouTube upload ----
      - key: YOUTUBE_DATA_API_KEY
        sync: false
      - key: YOUTUBE_CATEGORY_ID
        value: "24"

      # ---- Workflow: content / trends ----
      - key: CONTENT_CATEGORY
        value: "Entertainment"
      - key: TRENDS_REGION
        value: "US"

      # ---- Workflow: Google Sheet (topic/QC database) ----
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB_USED_TOPICS
        value: "UsedTopics"
      - key: GOOGLE_SHEET_TAB_QC_LOG
        value: "QC Log"

      # ---- Notifications ----
      - key: NOTIFY_EMAIL_SUCCESS
        sync: false
      - key: NOTIFY_EMAIL_ERROR
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
