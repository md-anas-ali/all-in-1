# =========================================================
# 
# =========================================================

services:
  - type: web
    name: n8n-allinone
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    autoDeploy: true
    healthCheckPath: /

    envVars:
      # ---- Host ----
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PORT
        value: "5678"
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: GENERIC_TIMEZONE
        value: Asia/Dhaka
      - key: TZ
        value: Asia/Dhaka

      # ---- Security ----
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false

      # ---- Database (external Postgres — Neon/Supabase free tier) ----
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        sync: false
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # ---- Internal microservices (এই একই কন্টেইনারে চলে, বাইরে
      #      এক্সপোজড না — সাধারণত এই ৪টার ডিফল্ট ভ্যালু বদলানোর
      #      দরকার নেই) ----
      - key: RENDER_VIDEO_EDIT_URL
        value: http://127.0.0.1:3001
      - key: RENDER_VIDEO_EDIT_API_KEY
        sync: false
      - key: ENABLE_TTS_SERVICE
        value: "false"
      - key: RENDER_TTS_URL
        value: http://127.0.0.1:3002
      - key: RENDER_TTS_API_KEY
        sync: false

      # ---- Workflow: AI script-generation keys ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_REFERER_URL
        sync: false
      - key: RENDER_AI_AGENT_URL
        sync: false
      - key: RENDER_AI_AGENT_API_KEY
        sync: false

      # ---- Workflow: voice / TTS (ElevenLabs -> edge-tts CLI -> silent) ----
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: EDGE_TTS_VOICE
        value: en-US-AndrewNeural

      # ---- Workflow: YouTube upload ----
      - key: YOUTUBE_DATA_API_KEY
        sync: false
      - key: YOUTUBE_CATEGORY_ID
        sync: false

      # ---- Workflow: content / trends ----
      - key: CONTENT_CATEGORY
        sync: false
      - key: TRENDS_REGION
        value: US

      # ---- Workflow: Google Sheet (topic/QC database) ----
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB_USED_TOPICS
        sync: false
      - key: GOOGLE_SHEET_TAB_QC_LOG
        synce: false

      # ---- Notifications ----
      - key: NOTIFY_EMAIL_SUCCESS
        sync: false
      - key: NOTIFY_EMAIL_ERROR
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
